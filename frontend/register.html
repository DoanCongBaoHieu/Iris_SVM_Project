<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đăng ký | Iris SVM Classifier</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="register.css"
    >

</head>


<body>

    <main class="register-page">

        <div class="register-card">


            <!-- =========================================
                 PANEL GIỚI THIỆU
            ========================================== -->

            <section class="register-brand-section">

                <div class="register-brand">

                    <div class="register-brand-icon">
                        🌸
                    </div>

                    <span class="register-brand-name">
                        Iris SVM Classifier
                    </span>

                </div>


                <div class="register-brand-content">

                    <div class="register-brand-label">
                        Iris SVM Classifier
                    </div>

                    <h1>
                        Tạo tài khoản<br>
                        để bắt đầu.
                    </h1>

                </div>


                <div class="register-brand-footer">
                    Iris SVM Classifier · KHOA HỌC DỮ LIỆU
                </div>

            </section>


            <!-- =========================================
                 FORM ĐĂNG KÝ
            ========================================== -->

            <section class="register-form-section">

                <div class="register-form-wrapper">


                    <div class="register-form-group">

                        <label for="register-username">
                            Tên đăng nhập
                        </label>

                        <input
                            type="text"
                            id="register-username"
                            placeholder="Ít nhất 3 ký tự"
                            autocomplete="username"
                        >

                    </div>


                    <div class="register-form-group">

                        <label for="register-password">
                            Mật khẩu
                        </label>

                        <input
                            type="password"
                            id="register-password"
                            placeholder="Ít nhất 6 ký tự"
                            autocomplete="new-password"
                        >

                    </div>


                    <div class="register-form-group">

                        <label for="register-confirm-password">
                            Xác nhận mật khẩu
                        </label>

                        <input
                            type="password"
                            id="register-confirm-password"
                            placeholder="Nhập lại mật khẩu"
                            autocomplete="new-password"
                        >

                    </div>


                    <div
                        id="register-message"
                        class="register-message"
                    ></div>


                    <button
                        type="button"
                        id="register-button"
                    >
                        Đăng ký
                    </button>


                    <p class="register-login">

                        Đã có tài khoản?

                        <a href="login.html">
                            Đăng nhập
                        </a>

                    </p>

                </div>

            </section>

        </div>

    </main>


    <script src="register.js"></script>

</body>

</html>
