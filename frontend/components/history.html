<section id="history" class="history-section">
    <div class="section-title">
        <span>🕘</span>
        <h2>Lịch sử dự đoán</h2>
    </div>

    <p class="section-description">
        Theo dõi các lần dự đoán hoa Iris của tài khoản hiện tại.
    </p>

    <div class="history-toolbar">
        <div class="history-summary">
            <span>Tổng số lần dự đoán:</span>
            <strong id="history-total">0</strong>
        </div>

        <button
            type="button"
            id="refresh-history-button"
            class="history-refresh-button"
        >
            🔄 Làm mới
        </button>
    </div>

    <div id="history-message" class="history-message"></div>

    <div class="history-table-wrapper">
        <table class="history-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Thời gian</th>
                    <th>Sepal Length</th>
                    <th>Sepal Width</th>
                    <th>Petal Length</th>
                    <th>Petal Width</th>
                    <th>Kết quả</th>
                    <th>Thời gian xử lý</th>
                </tr>
            </thead>

            <tbody id="history-table-body">
                <tr>
                    <td colspan="8" class="history-empty">
                        Chưa có lịch sử dự đoán.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="history-pagination">

    <button
        type="button"
        id="history-prev-button"
        class="history-page-button"
    >
        ← Trước
    </button>

    <div
        id="history-page-numbers"
        class="history-page-numbers"
    ></div>

    <button
        type="button"
        id="history-next-button"
        class="history-page-button"
    >
        Sau →
    </button>

</div>


</section>
