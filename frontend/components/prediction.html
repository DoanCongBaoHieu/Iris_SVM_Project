<div id="prediction" class="prediction-container">
    <!-- BÊN TRÁI: INPUT -->
    <section class="input-section">
        <h2>📋 Thông số đầu vào</h2>
        <p class="section-description">
            Nhập kích thước của đài hoa và cánh hoa theo đơn vị centimet.
        </p>

        <div class="input-group">
            <label for="sepal-length">Sepal Length <span>(cm)</span></label>
            <input type="number" id="sepal-length" placeholder="Ví dụ: 5.1" step="0.1">
        </div>

        <div class="input-group">
            <label for="sepal-width">Sepal Width <span>(cm)</span></label>
            <input type="number" id="sepal-width" placeholder="Ví dụ: 3.5" step="0.1">
        </div>

        <div class="input-group">
            <label for="petal-length">Petal Length <span>(cm)</span></label>
            <input type="number" id="petal-length" placeholder="Ví dụ: 1.4" step="0.1">
        </div>

        <div class="input-group">
            <label for="petal-width">Petal Width <span>(cm)</span></label>
            <input type="number" id="petal-width" placeholder="Ví dụ: 0.2" step="0.1">
        </div>

        <div id="error-message"></div>

        <div class="sample-buttons">
            <p class="sample-title">Dữ liệu mẫu nhanh:</p>
            <button type="button" onclick="fillSample('setosa')">🌸 Setosa</button>
            <button type="button" onclick="fillSample('versicolor')">🌸 Versicolor</button>
            <button type="button" onclick="fillSample('virginica')">🌸 Virginica</button>
        </div>

        <button id="predict-button" class="predict-button" type="button">
            🌸 DỰ ĐOÁN LOÀI HOA
        </button>
    </section>

    <!-- BÊN PHẢI: RESULT -->
    <section class="result-section">
        <h2>🔍 Kết quả dự đoán</h2>

        <!-- Placeholder trước khi dự đoán -->
        <div id="result-placeholder" class="result-placeholder">
            <div class="icon">🌱</div>
            <p>Nhập thông số và nhấn <strong>Dự đoán</strong> để xem kết quả.</p>
        </div>

        <!-- Kết quả sau khi dự đoán -->
        <div id="prediction-result" class="prediction-result hidden">
            <div class="flower-image-container">
                <img id="flower-image" src="" alt="Hoa Iris">
            </div>
            <div class="species-label">Loài hoa được dự đoán</div>
            <div id="species-name">-</div>
            <p id="prediction-message">-</p>
            <div id="prediction-code">Class: -</div>
        </div>
    </section>
</div>
