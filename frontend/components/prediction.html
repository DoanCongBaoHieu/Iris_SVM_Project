<div id="prediction" class="prediction-container">
    <!-- BÊN TRÁI: INPUT -->
    <section class="input-section">
        <h2>📋 Thông số đầu vào</h2>
        <p class="section-description">
            Nhập kích thước của đài hoa và cánh hoa theo đơn vị centimet.
        </p>

        <div class="input-group">
            <label for="sepal-length">Chiều dài đài hoa <span>(cm)</span></label>
            <input type="number" id="sepal-length" placeholder="Ví dụ: 5.1" step="0.1">
        </div>

        <div class="input-group">
            <label for="sepal-width">Chiều rộng đài hoa <span>(cm)</span></label>
            <input type="number" id="sepal-width" placeholder="Ví dụ: 3.5" step="0.1">
        </div>

        <div class="input-group">
            <label for="petal-length">Chiều dài cánh hoa <span>(cm)</span></label>
            <input type="number" id="petal-length" placeholder="Ví dụ: 1.4" step="0.1">
        </div>

        <div class="input-group">
            <label for="petal-width">Chiều rộng cánh hoa <span>(cm)</span></label>
            <input type="number" id="petal-width" placeholder="Ví dụ: 0.2" step="0.1">
        </div>

        <fieldset class="model-selection">
            <legend>Chọn thuật toán (có thể chọn nhiều):</legend>
            <div class="model-option-grid">
                <label class="model-option">
                    <input type="checkbox" name="prediction-model" value="svm" checked>
                    <span>Support Vector Machine (SVM)</span>
                </label>
                <label class="model-option">
                    <input type="checkbox" name="prediction-model" value="knn">
                    <span>K-Nearest Neighbors (K-NN)</span>
                </label>
                <label class="model-option">
                    <input type="checkbox" name="prediction-model" value="tree">
                    <span>Decision Tree</span>
                </label>
                <label class="model-option">
                    <input type="checkbox" name="prediction-model" value="random_forest">
                    <span>Random Forest</span>
                </label>
                <label class="model-option">
                    <input type="checkbox" name="prediction-model" value="logistic">
                    <span>Logistic Regression</span>
                </label>
            </div>
        </fieldset>

        <div id="error-message"></div>

        <div class="sample-buttons">
            <p class="sample-title">Dữ liệu mẫu nhanh:</p>
            <button type="button" onclick="fillSample('setosa')">🌸 Setosa</button>
            <button type="button" onclick="fillSample('versicolor')">🌸 Versicolor</button>
            <button type="button" onclick="fillSample('virginica')">🌸 Virginica</button>
        </div>

        <button id="predict-button" class="predict-button" type="button">
            🌸 DỰ ĐOÁN LOÀI HOA
        </button>
    </section>

    <!-- BÊN PHẢI: RESULT -->
    <section class="result-section">
        <h2>🔍 Kết quả dự đoán</h2>

        <!-- Placeholder trước khi dự đoán -->
        <div id="result-placeholder" class="result-placeholder">
            <div class="icon">🌱</div>
            <p>Nhập thông số và nhấn <strong>Dự đoán</strong> để xem kết quả.</p>
        </div>

        <!-- Kết quả sau khi dự đoán -->
        <div id="prediction-result" class="prediction-result hidden">
            <div class="flower-image-container">
                <img id="flower-image" src="" alt="Hoa Iris">
            </div>
            <div class="species-label">Loài hoa được dự đoán</div>
            <div id="species-name">-</div>
        </div>
        <div id="model-results" class="model-results hidden" aria-live="polite"></div>
    </section>
</div>
