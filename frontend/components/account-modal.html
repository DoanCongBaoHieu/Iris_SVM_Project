    <div id="change-password-modal" class="password-modal hidden">
        <div class="password-modal-overlay"></div>
        <section class="password-modal-content" role="dialog" aria-modal="true" aria-labelledby="password-modal-title">
            <button type="button" id="close-password-modal" class="password-modal-close" aria-label="Đóng">&#215;</button>
            <p class="eyebrow">Cài đặt tài khoản</p>
            <h2 id="password-modal-title">Đổi mật khẩu</h2>
            <p class="password-modal-description">Cập nhật mật khẩu tài khoản.</p>
            <div class="password-form-group">
                <label for="current-password">Mật khẩu hiện tại</label>
                <input type="password" id="current-password" autocomplete="current-password">
            </div>
            <div class="password-form-group">
                <label for="new-password">Mật khẩu mới</label>
                <input type="password" id="new-password" autocomplete="new-password">
            </div>
            <div class="password-form-group">
                <label for="confirm-password">Xác nhận mật khẩu</label>
                <input type="password" id="confirm-password" autocomplete="new-password">
            </div>
            <div id="password-message" class="password-message"></div>
            <div class="password-modal-actions">
                <button type="button" id="cancel-password-button" class="password-cancel-button">Hủy</button>
                <button type="button" id="submit-password-button" class="password-submit-button">Lưu mật khẩu</button>
            </div>
        </section>
    </div>
