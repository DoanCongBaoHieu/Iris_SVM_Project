<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập | Phân loại hoa Iris</title>
    <link rel="stylesheet" href="login.css?v=10">
</head>

<body class="login-only-body">
    <main class="login-page login-only-page">
        <header class="page-header">
            <a class="page-brand" href="login.html?v=9">
                <span class="page-brand-icon" aria-hidden="true">🌸</span>
                <span>Phân loại hoa Iris</span>
            </a>
            <nav class="page-nav" aria-label="Điều hướng chính">
                <a href="login.html?v=9">Giới thiệu</a>
            </nav>
        </header>

        <section class="login-only-main" aria-labelledby="login-title">
            <div class="login-only-card">
                <div class="login-puppy" id="login-puppy" aria-hidden="true">
                    <svg viewBox="0 0 180 150" role="presentation">
                        <path class="puppy-ear" d="M47 48C27 26 18 42 25 72c4 17 13 24 28 17M133 48c20-22 29-6 22 24-4 17-13 24-28 17"/>
                        <ellipse class="puppy-head" cx="90" cy="76" rx="57" ry="53"/>
                        <ellipse class="puppy-cheek" cx="57" cy="86" rx="12" ry="8"/>
                        <ellipse class="puppy-cheek" cx="123" cy="86" rx="12" ry="8"/>
                        <g class="puppy-eyes">
                            <ellipse cx="70" cy="67" rx="5" ry="7"/>
                            <ellipse cx="110" cy="67" rx="5" ry="7"/>
                            <circle class="puppy-eye-shine" cx="72" cy="64" r="2"/>
                            <circle class="puppy-eye-shine" cx="112" cy="64" r="2"/>
                        </g>
                        <ellipse class="puppy-muzzle" cx="90" cy="85" rx="19" ry="14"/>
                        <path class="puppy-nose" d="M82 81c0-5 16-5 16 0 0 4-6 7-8 7s-8-3-8-7z"/>
                        <path class="puppy-smile" d="M90 88v5m0 0c-5 7-11 3-12 0m12 0c5 7 11 3 12 0"/>
                        <g class="puppy-cover-paws">
                            <path class="puppy-arm" d="M61 127c2-17 5-30 12-45m46 45c-2-17-5-30-12-45"/>
                            <ellipse cx="71" cy="67" rx="18" ry="18" transform="rotate(18 71 67)"/>
                            <ellipse cx="109" cy="67" rx="18" ry="18" transform="rotate(-18 109 67)"/>
                        </g>
                        <path class="puppy-body" d="M61 132c3-17 13-25 29-25s26 8 29 25"/>
                        <path class="puppy-collar" d="M67 115c13 8 33 8 46 0"/>
                        <path class="puppy-tag" d="m90 119 7 8-7 8-7-8z"/>
                    </svg>
                </div>

                <p class="login-welcome">Chào mừng bạn quay lại</p>
                <h1 id="login-title">Đăng nhập</h1>
                <p class="login-subtitle">Đăng nhập để tiếp tục khám phá các mô hình dự đoán.</p>

                <div class="login-form-group">
                    <label for="login-username">Tên đăng nhập</label>
                    <input
                        type="text"
                        id="login-username"
                        placeholder="Nhập tên đăng nhập"
                        autocomplete="username"
                    >
                </div>

                <div class="login-form-group">
                    <label for="login-password">Mật khẩu</label>
                    <div class="password-input-wrap">
                        <input
                            type="password"
                            id="login-password"
                            placeholder="Nhập mật khẩu"
                            autocomplete="current-password"
                        >
                        <button
                            type="button"
                            id="toggle-password"
                            class="toggle-password"
                            aria-label="Hiện mật khẩu"
                            aria-pressed="false"
                        >Hiện</button>
                    </div>
                </div>

                <div id="login-error" class="login-message" role="alert"></div>
                <button type="button" id="login-button">Đăng nhập</button>

                <p class="login-register">
                    Chưa có tài khoản?
                    <a href="register.html">Đăng ký</a>
                </p>
            </div>
        </section>
    </main>
    <script src="login.js"></script>
</body>
</html>
